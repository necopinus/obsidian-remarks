name: Update website on content change

on:
  push:
    branches:
      - main

# Default to least-privilege. Netlify deploys use secrets, not
# GITHUB_TOKEN, so we only need read on the repo checkout.
permissions:
  contents: read

# Don't race concurrent pushes against each other. The later deploy
# wins; we don't cancel in-progress deploys.
concurrency:
  group: website-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          ./.build/build.sh
      - uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --no-build --dir ./.build/quartz/public --prod
