# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Delphi Foresight Strategy
  pageTitleSuffix: ":: Delphi Foresight Strategy"
  enableSPA: true
  enablePopovers: true
  locale: en-US
  baseUrl: remarks.delphi-strategy.com
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Sans
      body: Noto Sans
      code: Noto Sans Mono
    colors:
      lightMode:
        light: "#fcf2c7"           # --bg1
        lightgray: "#ebdbb2"       # --ui1
        gray: "#bdae93"            # --ui3
        darkgray: "#282828"        # --tx1
        dark: "#7c7065"            # --tx2
        secondary: "#bb520c"       # --ax1 (orange)
        tertiary: "#954109"        # --ax2 (orange)
        highlight: "#bb520c1a"     # --hl1 (orange)
        textHighlight: "#d7992166" # --hl2
      darkMode:
        light: "#282828"           # --bg1
        lightgray: "#3c3836"       # --ui1
        gray: "#665c54"            # --ui3
        darkgray: "#fbf1c7"        # --tx1
        dark: "#bdae93"            # --tx2
        secondary: "#bb520c"       # --ax1 (orange)
        tertiary: "#e1630e"        # --ax2 (orange)
        highlight: "#bb520c1a"     # --hl1 (orange)
        textHighlight: "#d7992166" # --hl2
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: gruvbox-light-soft
        dark: gruvbox-dark-soft
      keepBackground: true
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 6
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
      lazyLoad: true
      disableBrokenWikilinks: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      rssLimit: 1000
      rssFullHtml: true
      includeEmptyFiles: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Navigation
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: Index
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Frontpage: https://delphi-strategy.com
        RSS feed: /index.xml
        GitHub: https://github.com/necopinus
        Author: https://necopinus.xyz
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 4
      showTags: false
      linkToMore: true
      hideTagPages: true
      hideFolderPages: true
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/note-properties"
    enabled: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
